<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#111;
    color:white;
    padding:20px;
}

.container{
    width:90%;
    margin:auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h2{
    margin:0;
    color:#d4af37;
}

.card p{
    font-size:30px;
    font-weight:bold;
}

</style>

</head>
<body>

<header>
    <div class="container">
        <h1>Admin Dashboard</h1>
    </div>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h2>Users</h2>
            <p id="users">0</p>
        </div>

        <div class="card">
            <h2>Products</h2>
            <p id="products">0</p>
        </div>

        <div class="card">
            <h2>Orders</h2>
            <p id="orders">0</p>
        </div>

        <div class="card">
            <h2>Messages</h2>
            <p id="messages">0</p>
        </div>

    </div>

</div>

<script src="admin.js"></script>

</body>
</html>
